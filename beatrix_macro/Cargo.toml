[package]
name = "beatrix_macro"
version = "0.1.0"
authors = ["Anit Nilay <anit.nilay20@gmail.com>"]
edition = "2018"

[lib]
proc-macro = true

[features]
# Add this line to specify default features
default = ["postgres"] 

postgres = ["beatrix_core/postgres"]
mongo = ["beatrix_core/mongo"]

[dependencies]
syn = "2.0.115"
quote = "1.0.44"
proc-macro2 = "1.0.106"
beatrix_core = { path="../beatrix_core", version = "0.1.0" }

[dev-dependencies]
macrotest = "1.2.0"